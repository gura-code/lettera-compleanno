<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            min-height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            background-color: #f4ece8; 
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* Animazione Pulse fluida */
        @keyframes pulseZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Contenitore busta chiusa con padding per evitare tagli */
        #state-closed {
            padding: 40px; 
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .breathing { animation: pulseZoom 2.5s infinite ease-in-out; }

        /* Sticker (nascosti all'inizio) */
        .background-stickers {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 1;
        }
        .sticker { position: absolute; width: 75px; opacity: 0.35; }
        .st-tl { top: 5%; left: 5%; } .st-tr { top: 5%; right: 5%; }
        .st-bl { bottom: 5%; left: 5%; } .st-br { bottom: 5%; right: 5%; }

        /* Seconda pagina: Layout ordinato senza sovrapposizioni */
        #state-open { 
            display: none; 
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Spazio tra busta e messaggio */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .envelope-open-img { width: 300px; max-width: 80vw; }
        .message-card-img { width: 320px; max-width: 85vw; }
    </style>
</head>
<body>

    <div id="stickers-container" class="background-stickers">
        <img src="cake-sticker.png" class="sticker st-tl" alt="Sticker">
        <img src="cake-sticker.png" class="sticker st-tr" alt="Sticker">
        <img src="cake-sticker.png" class="sticker st-bl" alt="Sticker">
        <img src="cake-sticker.png" class="sticker st-br" alt="Sticker">
    </div>

    <!-- Pagina 1 -->
    <div id="state-closed" class="breathing" onclick="openLetter()">
        <img src="envelope-closed.png" style="width: 250px;" alt="Busta chiusa">
    </div>

    <!-- Pagina 2 -->
    <div id="state-open">
        <img src="envelope-open.png" class="envelope-open-img" alt="Busta aperta">
        <img src="message-card.png" class="message-card-img" alt="Messaggio">
    </div>

    <script>
        function openLetter() {
            const closed = document.getElementById('state-closed');
            const open = document.getElementById('state-open');
            const stickers = document.getElementById('stickers-container');

            // 1. Dissolvenza pagina 1
            closed.style.opacity = '0';
            closed.classList.remove('breathing');

            setTimeout(() => {
                closed.style.display = 'none';
                
                // 2. Mostra pagina 2
                open.style.display = 'flex';
                // Piccola pausa per attivare la transizione CSS
                setTimeout(() => {
                    open.style.opacity = '1';
                    open.style.transform = 'translateY(0)';
                    stickers.style.opacity = '1';
                }, 50);
            }, 800); // Sincronizzato con la durata della transizione
        }
    </script>
</body>
</html>
