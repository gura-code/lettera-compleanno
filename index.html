<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100vh; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            background-color: #faf5f3; 
            font-family: sans-serif;
        }

        /* Stile comune per lo sfondo con i fioretti chiari e immobili su entrambe le pagine */
        .page-background {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            top: 0; left: 0;
        }

        .page-background::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('flower.gif');
            background-repeat: repeat;
            background-size: 140px 140px;
            background-position: 0 0, 70px 70px;
            opacity: 0.18; /* Molto leggero e trasparente */
            pointer-events: none;
        }

        /* Pagina 1 */
        #state-closed {
            cursor: pointer;
            transition: opacity 0.6s ease;
            z-index: 10;
        }

        /* Animazione Pulse applicata SOLO alla busta chiusa */
        @keyframes pulseZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .breathing { animation: pulseZoom 2.5s infinite ease-in-out; }
        
        #envelope-closed { 
            width: 240px; 
            position: relative; 
            z-index: 2; 
        }

        /* Pagina 2: Layout fisso con lo stesso sfondo fiorito leggero */
        #state-open { 
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Messaggio: sale dal basso */
        .message-card-img { 
            width: 300px; 
            max-width: 80vw; 
            margin-bottom: 20px; 
            transform: translateY(80px);
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            z-index: 2;
        }

        /* Busta aperta */
        .envelope-open-img { 
            width: 280px; 
            max-width: 75vw; 
            position: relative;
            z-index: 2;
        }

        #state-open.active {
            opacity: 1;
        }

        #state-open.active .message-card-img {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Pagina 1 -->
    <div id="state-closed" class="page-background" onclick="openLetter()">
        <img src="envelope-closed.png" id="envelope-closed" class="breathing" alt="Busta chiusa">
    </div>

    <!-- Pagina 2 (con lo stesso sfondo leggero) -->
    <div id="state-open" class="page-background">
        <img src="message-card.png" class="message-card-img" alt="Messaggio">
        <img src="envelope-open.png" class="envelope-open-img" alt="Busta aperta">
    </div>

    <script>
        function openLetter() {
            const closed = document.getElementById('state-closed');
            const open = document.getElementById('state-open');

            closed.style.opacity = '0';

            setTimeout(() => {
                closed.style.display = 'none';
                open.style.display = 'flex';
                
                setTimeout(() => {
                    open.classList.add('active');
                }, 50);
            }, 600);
        }
    </script>
</body>
</html>
