<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100vh; /* Forza l'altezza dello schermo */
            overflow: hidden; /* Blocca lo scroll */
            display: flex; justify-content: center; align-items: center; 
            background-color: #f4ece8; 
            font-family: sans-serif;
        }

        /* Animazione Pulse per la busta chiusa */
        @keyframes pulseZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Pagina 1: Busta chiusa */
        #state-closed {
            cursor: pointer;
            transition: opacity 0.8s ease;
            z-index: 10;
        }
        .breathing { animation: pulseZoom 2.5s infinite ease-in-out; }
        #envelope-closed { width: 250px; }

        /* Sticker (Pagina 2) */
        .background-stickers {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 1;
        }
        .sticker { position: absolute; width: 70px; opacity: 0.35; }
        .st-tl { top: 3%; left: 5%; } .st-tr { top: 3%; right: 5%; }
        .st-bl { bottom: 3%; left: 5%; } .st-br { bottom: 3%; right: 5%; }

        /* Pagina 2: Layout fisso senza ombre */
        #state-open { 
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Occupa tutto lo schermo */
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 5;
        }

        /* Messaggio (Sopra) e Busta (Sotto) - senza ombre */
        .message-card-img { width: 300px; max-width: 80vw; margin-bottom: 20px; }
        .envelope-open-img { width: 280px; max-width: 75vw; }
    </style>
</head>
<body>

    <div id="stickers-container" class="background-stickers">
        <img src="cake-sticker.png" class="sticker st-tl" alt="Sticker">
        <img src="cake-sticker.png" class="sticker st-tr" alt="Sticker">
        <img src="cake-sticker.png" class="sticker st-bl" alt="Sticker">
        <img src="cake-sticker.png" class="sticker st-br" alt="Sticker">
    </div>

    <!-- Pagina 1 -->
    <div id="state-closed" class="breathing" onclick="openLetter()">
        <img src="envelope-closed.png" id="envelope-closed" alt="Busta chiusa">
    </div>

    <!-- Pagina 2 -->
    <div id="state-open">
        <img src="message-card.png" class="message-card-img" alt="Messaggio">
        <img src="envelope-open.png" class="envelope-open-img" alt="Busta aperta">
    </div>

    <script>
        function openLetter() {
            const closed = document.getElementById('state-closed');
            const open = document.getElementById('state-open');
            const stickers = document.getElementById('stickers-container');

            closed.style.opacity = '0';
            closed.classList.remove('breathing');

            setTimeout(() => {
                closed.style.display = 'none';
                open.style.display = 'flex';
                // Piccola pausa per la transizione
                setTimeout(() => {
                    open.style.opacity = '1';
                    stickers.style.opacity = '1';
                }, 50);
            }, 800);
        }
    </script>
</body>
</html>
