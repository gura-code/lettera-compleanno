<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100vh; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            background-color: #faf5f3; 
            font-family: sans-serif;
        }

        /* Pattern geometrico a rombi con i fioretti piccoli sulla prima pagina */
        #state-closed {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
            z-index: 10;
            /* Crea il pattern a rombi ripetuti con il fiore (30px di dimensione per farli piccoli) */
            background-image: url('flower.png');
            background-repeat: repeat;
            background-size: 60px 60px; /* Distanza del ripetersi del rombo */
            background-position: 0 0, 30px 30px;
        }

        /* Scritta dolce sopra la busta nella prima pagina */
        .cover-text {
            font-size: 18px;
            color: #b5838d;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: 500;
            background-color: rgba(250, 245, 243, 0.9);
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* Animazione Pulse per la busta chiusa */
        @keyframes pulseZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .breathing { animation: pulseZoom 2.5s infinite ease-in-out; }
        #envelope-closed { width: 240px; }

        /* Pagina 2: Layout fisso */
        #state-open { 
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            z-index: 5;
        }

        /* Messaggio: sale dal basso */
        .message-card-img { 
            width: 300px; 
            max-width: 80vw; 
            margin-bottom: 20px; 
            opacity: 0;
            transform: translateY(80px);
            transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1), transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Busta aperta */
        .envelope-open-img { 
            width: 280px; 
            max-width: 75vw; 
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #state-open.active .message-card-img {
            opacity: 1;
            transform: translateY(0);
        }

        #state-open.active .envelope-open-img {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Pagina 1 con pattern a rombi di fioretti e scritta -->
    <div id="state-closed" class="breathing" onclick="openLetter()">
        <div class="cover-text">Una sorpresa per te...</div>
        <img src="envelope-closed.png" id="envelope-closed" alt="Busta chiusa">
    </div>

    <!-- Pagina 2 -->
    <div id="state-open">
        <img src="message-card.png" class="message-card-img" alt="Messaggio">
        <img src="envelope-open.png" class="envelope-open-img" alt="Busta aperta">
    </div>

    <script>
        function openLetter() {
            const closed = document.getElementById('state-closed');
            const open = document.getElementById('state-open');

            closed.style.opacity = '0';
            closed.classList.remove('breathing');

            setTimeout(() => {
                closed.style.display = 'none';
                open.style.display = 'flex';
                
                setTimeout(() => {
                    open.classList.add('active');
                }, 50);
            }, 600);
        }
    </script>
</body>
</html>
