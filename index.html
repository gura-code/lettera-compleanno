<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #fdf6f0; transition: background 0.5s; }
        
        /* Contenitore per gli sticker che fluttuano */
        #background-stickers { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 0; opacity: 0; transition: opacity 0.5s; }
        .sticker { position: absolute; width: 100px; animation: float 3s ease-in-out infinite; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }

        /* Contenitori per le fasi */
        #state-closed { cursor: pointer; z-index: 10; }
        #state-open { display: none; position: relative; z-index: 10; text-align: center; }
        
        img { max-width: 300px; }
        #message-card { margin-top: -150px; } /* Posiziona il biglietto sopra la busta */
    </style>
</head>
<body>

    <!-- Sfondo con sticker che appaiono dopo -->
    <div id="background-stickers">
        <img src="cake-sticker.png" class="sticker" style="top: 10%; left: 10%;">
        <img src="cake-sticker.png" class="sticker" style="top: 20%; right: 15%; animation-delay: 1s;">
        <img src="cake-sticker.png" class="sticker" style="bottom: 10%; left: 20%; animation-delay: 2s;">
    </div>

    <!-- Stato 1: Busta chiusa -->
    <div id="state-closed" onclick="openEnvelope()">
        <img src="envelope-closed.png" alt="Busta chiusa">
    </div>

    <!-- Stato 2: Busta aperta -->
    <div id="state-open">
        <img src="envelope-open.png" alt="Busta aperta">
        <br>
        <img src="message-card.png" id="message-card" alt="Messaggio">
    </div>

    <script>
        function openEnvelope() {
            // Nasconde la busta chiusa
            document.getElementById('state-closed').style.display = 'none';
            // Mostra la busta aperta
            document.getElementById('state-open').style.display = 'block';
            // Cambia sfondo (schiarisce) e mostra gli sticker
            document.body.style.backgroundColor = "#ffffff";
            document.getElementById('background-stickers').style.opacity = "0.4";
        }
    </script>
</body>
</html>
