<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100vh; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            /* Sfondo leggermente più caldo per far staccare la lettera */
            background-color: #ede4de; 
            font-family: sans-serif;
        }

        /* Effetto ombra sagomata che elimina visivamente i bordi scuri */
        .image-shadow {
            filter: drop-shadow(0 4px 12px rgba(110, 85, 75, 0.18));
        }

        /* Animazione Pulse per la busta chiusa */
        @keyframes pulseZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #state-closed {
            cursor: pointer;
            transition: opacity 0.6s ease;
            z-index: 10;
        }
        .breathing { animation: pulseZoom 2.5s infinite ease-in-out; }
        #envelope-closed { width: 250px; }

        /* Pagina 2: Layout fisso */
        #state-open { 
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            z-index: 5;
        }

        /* Messaggio: sale dal basso con ombra sagomata */
        .message-card-img { 
            width: 300px; 
            max-width: 80vw; 
            margin-bottom: 20px; 
            opacity: 0;
            transform: translateY(80px);
            transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1), transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Busta aperta con ombra sagomata */
        .envelope-open-img { 
            width: 280px; 
            max-width: 75vw; 
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #state-open.active .message-card-img {
            opacity: 1;
            transform: translateY(0);
        }

        #state-open.active .envelope-open-img {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Pagina 1 -->
    <div id="state-closed" class="breathing" onclick="openLetter()">
        <img src="envelope-closed.png" id="envelope-closed" class="image-shadow" alt="Busta chiusa">
    </div>

    <!-- Pagina 2 -->
    <div id="state-open">
        <img src="message-card.png" class="message-card-img image-shadow" alt="Messaggio">
        <img src="envelope-open.png" class="envelope-open-img image-shadow" alt="Busta aperta">
    </div>

    <script>
        function openLetter() {
            const closed = document.getElementById('state-closed');
            const open = document.getElementById('state-open');

            closed.style.opacity = '0';
            closed.classList.remove('breathing');

            setTimeout(() => {
                closed.style.display = 'none';
                open.style.display = 'flex';
                
                setTimeout(() => {
                    open.classList.add('active');
                }, 50);
            }, 600);
        }
    </script>
</body>
</html>
