<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100vh; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            background-color: #f4ece8; 
            font-family: sans-serif;
        }

        /* Animazione Pulse per la busta chiusa */
        @keyframes pulseZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Pagina 1: Busta chiusa */
        #state-closed {
            cursor: pointer;
            transition: opacity 0.6s ease;
            z-index: 10;
        }
        .breathing { animation: pulseZoom 2.5s infinite ease-in-out; }
        #envelope-closed { width: 250px; }

        /* Pagina 2: Layout fisso */
        #state-open { 
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            z-index: 5;
        }

        /* Animazione speciale per il messaggio: sale dal basso */
        .message-card-img { 
            width: 300px; 
            max-width: 80vw; 
            margin-bottom: 20px; 
            opacity: 0;
            transform: translateY(80px); /* Parte più in basso */
            transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1), transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Effetto dissolvenza dolce per la busta aperta */
        .envelope-open-img { 
            width: 280px; 
            max-width: 75vw; 
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Classe attivata con JavaScript per avviare il movimento */
        #state-open.active .message-card-img {
            opacity: 1;
            transform: translateY(0); /* Sale al suo posto */
        }

        #state-open.active .envelope-open-img {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Pagina 1: Busta chiusa -->
    <div id="state-closed" class="breathing" onclick="openLetter()">
        <img src="envelope-closed.png" id="envelope-closed" alt="Busta chiusa">
    </div>

    <!-- Pagina 2: Messaggio in alto + Busta in basso -->
    <div id="state-open">
        <img src="message-card.png" class="message-card-img" alt="Messaggio">
        <img src="envelope-open.png" class="envelope-open-img" alt="Busta aperta">
    </div>

    <script>
        function openLetter() {
            const closed = document.getElementById('state-closed');
            const open = document.getElementById('state-open');

            // 1. Scompare la prima pagina
            closed.style.opacity = '0';
            closed.classList.remove('breathing');

            setTimeout(() => {
                closed.style.display = 'none';
                open.style.display = 'flex';
                
                // 2. Avvia l'animazione di uscita dal basso
                setTimeout(() => {
                    open.classList.add('active');
                }, 50);
            }, 600);
        }
    </script>
</body>
</html>
